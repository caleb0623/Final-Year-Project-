<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Attire Checker</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='web.css') }}">
  <script src="{{ url_for('static', filename='common.js') }}" defer></script>
  <script src="{{ url_for('static', filename='account.js') }}" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="{{ url_for('static', filename='tarumt-logo.png') }}" alt="Tunku Abdul Rahman University of Management and Technology">
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Reset password</h1>
    <p class="muted" id="reset-intro">Enter your account ID. A 6-digit code is emailed to the address on your account (administrators and lecturers).</p>
    <form id="reset-request-form" class="login-form">
      <label for="reset-id">Account ID</label>
      <input id="reset-id" autocomplete="username" placeholder="e.g. AD001, L00001" required>
      <button class="button button-primary button-wide" type="submit">Send code</button>
    </form>
    <form id="reset-confirm-form" class="login-form" hidden>
      <label for="reset-code">Verification code</label>
      <input id="reset-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 digits" required>
      <label for="reset-password">New password</label>
      <input id="reset-password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="reset-password2">Confirm new password</label>
      <input id="reset-password2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="button button-primary button-wide" type="submit">Reset password</button>
    </form>
    <p class="login-footnote"><a href="{{ url_for('home') }}">Back to sign in</a></p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
